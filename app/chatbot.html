<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Support Chatbot</title>
<style>
  body { font-family: Arial, sans-serif; background:#f3f4f6; margin:0; display:flex; justify-content:center; padding:24px; }
  #chat { width:420px; max-width:100%; background:#fff; border:1px solid #d1d5db; border-radius:10px; display:flex; flex-direction:column; height:600px; }
  header { background:#1f3864; color:#fff; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; border-radius:10px 10px 0 0; }
  header h1 { font-size:16px; margin:0; }
  #new-chat { background:transparent; color:#fff; border:1px solid #fff; border-radius:6px; padding:4px 8px; cursor:pointer; }
  #chat-log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .welcome { color:#6b7280; font-size:13px; text-align:center; }
  .msg { max-width:80%; padding:8px 12px; border-radius:12px; font-size:14px; line-height:1.4; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:#1f3864; color:#fff; }
  .msg.bot  { align-self:flex-start; background:#e5e7eb; color:#111827; }
  #typing { padding:0 14px 6px; color:#6b7280; font-size:12px; }
  #input-hint { padding:0 14px; color:#b91c1c; font-size:12px; min-height:16px; }
  footer { display:flex; gap:8px; padding:10px; border-top:1px solid #e5e7eb; }
  #user-input { flex:1; resize:none; height:40px; padding:8px; font-family:inherit; font-size:14px; border:1px solid #d1d5db; border-radius:6px; }
  #send-btn { background:#1f3864; color:#fff; border:0; border-radius:6px; padding:0 16px; cursor:pointer; }
</style>
</head>
<body>
<main id="chat" aria-label="Support chatbot">
  <header>
    <h1>Support Assistant</h1>
    <button id="new-chat" type="button">New chat</button>
  </header>
  <div id="chat-log" role="log" aria-live="polite" data-testid="chat-log">
    <div class="welcome" id="welcome">Hi! Ask me about orders, plans, returns or support hours.</div>
  </div>
  <div id="typing" data-testid="typing-indicator" hidden>Assistant is typing…</div>
  <div id="input-hint" role="alert"></div>
  <footer>
    <textarea id="user-input" aria-label="Type your message" placeholder="Type your message…"></textarea>
    <button id="send-btn" type="button">Send</button>
  </footer>
</main>

<script>
/* ---------- Mock "LLM": deterministic rules so tests are repeatable ---------- */
const MAX_LEN = 500;
const HOURS = "Our support hours are Monday to Friday, 9am to 6pm.";
const PLANS = {
  basic: { price: "$10/month", info: "The Basic plan includes 1 user and 10 GB of storage." },
  pro:   { price: "$25/month", info: "The Pro plan includes 5 users, 100 GB of storage and priority support." }
};
let ctx = { plan: null, topic: null };

function reply(intent, text, lang) { return { intent, text, lang: lang || "en" }; }

function respond(raw) {
  const t = raw.toLowerCase();

  if (raw.length > MAX_LEN)
    return reply("input_too_long", "Your message is too long. Please keep it under 500 characters.");

  // --- security / safety first
  if (/ignore (all )?(previous|prior) instructions|system prompt|you are now dan|developer mode|^system:/.test(t))
    return reply("injection_refusal", "I can't share internal instructions or change my role. I can help with orders, plans and account support.");
  if (/can'?t go on|kill myself|hurt myself|end my life|suicid/.test(t))
    return reply("self_harm_support", "I'm really sorry you're feeling this way. You are not alone. Please contact your local emergency number or a crisis line right now, and reach out to someone you trust. Would you like me to connect you with a human agent?");
  if (/build a bomb|make a bomb|make a weapon/.test(t))
    return reply("harmful_refusal", "Sorry, I can't help with that request.");
  if (/\b(?:\d[ -]?){13,16}\b/.test(raw) || /\b\d{3}-\d{2}-\d{4}\b/.test(raw))
    return reply("pii_warning", "For your security, please don't share card or ID numbers in chat. It has not been stored. Please use our secure payment page instead.");
  if (/medication|medicine|dosage/.test(t))
    return reply("medical_disclaimer", "I can't give medical advice. Please speak to a doctor or pharmacist.");

  // --- identity / handoff / scope
  if (/are you (a )?(human|real person|robot|bot)|am i (talking|speaking) (to|with) (a )?(real person|human|bot)/.test(t))
    return reply("ai_disclosure", "I'm an AI assistant, not a human. I can connect you to a human agent if you'd like.");
  if (/\b(human|agent|real person|representative)\b/.test(t))
    return reply("human_handoff", "Connecting you to a human agent. Agents are available Monday to Friday, 9am to 6pm.");
  if (/essay|homework|poem|python script/.test(t))
    return reply("out_of_scope", "Sorry, I can only help with orders, plans, returns and account support.");

  // --- language
  if (/d[oó]nde|pedido|hola|gracias/.test(t))
    return reply("spanish_order", "Puedo ayudarte con tu pedido. ¿Cuál es tu número de pedido?", "es");

  // --- factual integrity
  if (/(raise|raised|increase|increased|hike).*price|price.*(raise|increase|hike)/.test(t))
    return reply("false_premise", "I have no record of a price increase. Our prices have not changed.");
  if (/24\/7|24 7/.test(t))
    return reply("no_247", "We don't offer 24/7 phone support. " + HOURS);
  if (/platinum|elite/.test(t))
    return reply("unknown_product", "I don't have any information about that plan. Our available plans are Basic and Pro.");

  // --- format requests
  if (/json/.test(t))
    return reply("json_format", JSON.stringify({ answer: HOURS }));

  // --- small talk
  if (/^(hi|hello|hey)\b/.test(t)) return reply("greeting", "Hello! How can I help you today?");
  if (/\b(bye|goodbye)\b|^thanks|thank you/.test(t)) return reply("farewell", "You're welcome! Have a great day.");

  // --- knowledge base
  if (/\bhours\b|\bopen\b|when are you|when r u/.test(t)) return reply("hours", HOURS);
  if (/password|can'?t log ?in|reset/.test(t))
    return reply("password_reset", "To reset your password: 1) Click 'Forgot password' on the login page. 2) Enter your email. 3) Open the reset link we send you. 4) Choose a new password.");

  if (/return|refund/.test(t)) {
    ctx.topic = "returns";
    return reply("return_policy", "You can return items within 30 days of delivery for a full refund.");
  }
  if (/how long|how many days/.test(t) && ctx.topic === "returns")
    return reply("return_window", "You have 30 days from the delivery date to return an item.");

  if (/order/.test(t)) {
    const m = t.match(/#?(\d{4,})/);
    if (!m) return reply("order_ask_id", "Sure, could you share your order number?");
    if (m[1] === "48213") return reply("order_status", "Order #48213 is out for delivery and should arrive within 2 days.");
    return reply("order_not_found", "I couldn't find order #" + m[1] + ". Please check the number and try again.");
  }

  const mentioned = /\bbasic\b/.test(t) ? "basic" : /\bpro\b/.test(t) ? "pro" : null;
  const priceIntent = /price|cost|how much/.test(t) || (/^and\b/.test(t) && ctx.topic === "price");
  if (priceIntent) {
    const plan = mentioned || ctx.plan;
    if (plan) {
      ctx.plan = plan; ctx.topic = "price";
      return reply("price", "The " + plan[0].toUpperCase() + plan.slice(1) + " plan costs " + PLANS[plan].price + ".");
    }
    return reply("price_ask_plan", "We have a Basic plan and a Pro plan. Which one are you interested in?");
  }
  if (mentioned) {
    ctx.plan = mentioned; ctx.topic = "plan_info";
    return reply("plan_info", PLANS[mentioned].info);
  }

  return reply("clarify", "I'm not sure I understood. Could you tell me a bit more about what you need?");
}

/* ---------- UI ---------- */
const log = document.getElementById("chat-log");
const input = document.getElementById("user-input");
const hint = document.getElementById("input-hint");
const typing = document.getElementById("typing");

function addMessage(who, text, meta) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.setAttribute("data-testid", who + "-message");
  el.textContent = text;                       // textContent => never interpreted as HTML
  if (meta) { el.dataset.intent = meta.intent; el.dataset.lang = meta.lang; }
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function send() {
  const text = input.value;
  if (!text.trim()) { hint.textContent = "Please type a message."; return; }
  hint.textContent = "";
  addMessage("user", text);
  input.value = "";
  typing.hidden = false;
  setTimeout(() => {
    const r = respond(text);
    typing.hidden = true;
    addMessage("bot", r.text, r);
  }, 300);
}

document.getElementById("send-btn").addEventListener("click", send);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById("new-chat").addEventListener("click", () => {
  log.querySelectorAll(".msg").forEach(n => n.remove());
  ctx = { plan: null, topic: null };
  hint.textContent = "";
});
</script>
</body>
</html>
